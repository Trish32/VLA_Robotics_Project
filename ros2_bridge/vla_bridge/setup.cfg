# Without this, setuptools puts console_scripts in install/vla_bridge/bin/, where the ROS
# launcher does not look: `ros2 run vla_bridge vla_policy_node` and every launch file fail
# with "libexec directory '/ws/install/vla_bridge/lib/vla_bridge' does not exist".
#
# Every ament_python package carries this stanza. This one did not, so the run command in
# the README had never actually worked — the package built cleanly and colcon reported
# success, because building is not the same as being runnable.
[develop]
script_dir=$base/lib/vla_bridge
[install]
install_scripts=$base/lib/vla_bridge
